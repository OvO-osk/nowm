<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无水印下载</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { --bg:#0f0f11; --card:#1a1a1e; --fg:#eeece6; --dim:#8a8a90; --gold:#ffce82; --red:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 20px; font-size:14px; }
  textarea { width:100%; min-height:110px; background:var(--card); color:var(--fg); border:1px solid #333; border-radius:12px; padding:12px; font:inherit; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  button { flex:1; min-width:120px; padding:12px; border:0; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; background:#2a2a30; color:var(--fg); }
  button.main { background:var(--gold); color:#1a1408; }
  button:disabled { opacity:.5; cursor:wait; }
  #msg { margin-top:16px; color:var(--dim); min-height:24px; }
  #msg.err { color:var(--red); }
  .card { margin-top:16px; background:var(--card); border-radius:12px; padding:14px; }
  .card b { color:var(--gold); }
  .card video, .card img { width:100%; border-radius:8px; margin-top:10px; background:#000; }
  .card a { color:var(--gold); word-break:break-all; display:block; margin-top:6px; font-size:14px; }
  #prog { display:none; margin-top:16px; }
  #prog.on { display:block; }
  .bar { height:12px; background:var(--card); border-radius:6px; overflow:hidden; border:1px solid #2a2a30; }
  .fill { height:100%; width:0; background:linear-gradient(90deg,#d6964a,var(--gold)); border-radius:6px; transition:width .25s; }
  .bar.indet .fill { width:30% !important; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
  .pinfo { display:flex; justify-content:space-between; font-size:13px; color:var(--dim); margin-top:6px; }
  .pinfo b { color:var(--gold); font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .save { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .card a.btn { display:inline-block; margin:0; padding:10px 14px; border-radius:10px; background:var(--gold); color:#1a1408; font-weight:600; text-decoration:none; font-size:15px; }
  .hint { color:var(--dim); font-size:13px; margin-top:8px; }
  #phone { display:none; margin-top:16px; background:var(--card); border-radius:12px; padding:14px; gap:14px; align-items:center; }
  #phone.on { display:flex; }
  #phone img { width:132px; height:132px; border-radius:8px; background:#fff; flex:none; }
  #phone b { color:var(--gold); word-break:break-all; }
  body.mobile .pc { display:none !important; }
  @media (max-width:480px) { main { padding-top:20px; } button { min-width:0; } }
</style>
</head>
<body>
<main>
  <h1>无水印下载</h1>
  <p class="sub">抖音 · 小红书 · 快手 · B站 · 微博 · TikTok · X · YouTube · Instagram</p>
  <div id="login" class="card" style="display:none">
    <div>这是你的私人下载器，输入部署时设的密码（只需输一次）</div>
    <div class="row"><input id="key" type="password" autocomplete="current-password" placeholder="密码"
      style="flex:2;min-width:0;background:#111;color:var(--fg);border:1px solid #333;border-radius:10px;padding:12px;font:inherit">
      <button class="main" id="loginBtn">进入</button></div>
  </div>
  <p class="sub" id="how">在 App 里点“分享 → 复制链接”，把整段文字粘贴到下面即可。文件保存到 D:\vibe\xiazai</p>
  <textarea id="t" placeholder="例：7.43 复制打开抖音，看看【xxx的作品】… https://v.douyin.com/xxxx/"></textarea>
  <div class="row">
    <button class="main" id="go">解析并下载</button>
    <button id="paste">从剪贴板粘贴</button>
    <button id="open" class="pc">打开下载文件夹</button>
  </div>
  <div id="phone" class="pc"><img src="/qr.svg" alt="二维码">
    <div>手机连同一个 Wi-Fi，用相机或浏览器扫码打开<br><b id="lan"></b><br>
      <span class="hint">电脑上的服务窗口要一直开着</span></div></div>
  <div id="prog"><div class="bar"><div class="fill"></div></div>
    <div class="pinfo"><span><b id="pct">0%</b> <span id="pfile"></span></span><span id="pbytes"></span></div></div>
  <div id="msg"></div>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(s, err) { $('#msg').textContent = s; $('#msg').className = err ? 'err' : ''; }

async function go() {
  const text = $('#t').value.trim();
  if (!text) return say('先粘贴分享链接', true);
  $('#go').disabled = true; say('解析链接中…');
  setProg(null);
  try {
    const r0 = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    const j0 = await r0.json();
    if (r0.status === 401) lock(true);
    if (!r0.ok) throw new Error(j0.error || r0.status);
    let job;
    while (true) {
      await new Promise(res => setTimeout(res, 250));
      job = await (await fetch('/api/job/' + j0.id)).json();
      if (job.stage === 'error') throw new Error(job.error);
      if (job.stage === 'done') break;
      if (job.stage === 'download') { say('下载中…'); setProg(job); }
    }
    setProg({pct:100, file:job.files, files:job.files, done:job.done, total:job.done || job.total});
    const d = job.result;
    say(`已保存 ${d.saved.length} 个文件`);
    const plat = {douyin:'抖音', xhs:'小红书', kuaishou:'快手', bilibili:'B站', weibo:'微博', tiktok:'TikTok',
                  x:'X', youtube:'YouTube', instagram:'Instagram'}[d.platform] || d.platform;
    const isVid = f => /\.(mp4|webm|mkv|mov)$/i.test(f);
    const vids = d.files.filter(isVid), imgs = d.files.filter(f => !isVid(f));
    let media = vids.map(f => `<video src="${f}" controls playsinline></video>`).join('');
    if (imgs.length) media += `<div class="grid">${imgs.map(f => `<img src="${f}" loading="lazy">`).join('')}</div>`;
    const what = [vids.length ? (vids.length > 1 ? vids.length + ' 个视频' : '视频') : '', imgs.length ? imgs.length + ' 张图' : ''].filter(Boolean).join(' + ');
    $('#out').insertAdjacentHTML('afterbegin', `<div class="card">
      <div><b>${plat}</b> · ${esc(d.author)} · ${what}</div>
      <div>${esc(d.title)}</div>${media}
      <div class="save">${d.files.map((f, i) => `<a class="btn" href="${f}?dl=1" download>${
        MOBILE ? '保存到手机' : '另存为'}${d.files.length > 1 ? ' ' + (i + 1) : ''}</a>`).join('')}</div>
      ${MOBILE ? `<div class="hint">${IOS ? 'iPhone：点“保存”后在「文件 → 下载」里打开，点分享 →「存储视频」；图片可直接长按 →「存储到照片」' : '保存后在「文件管理 / 下载」里能找到；图片也可以长按保存'}</div>` : ''}
      ${MOBILE ? '' : d.saved.map((p, i) => `<a href="${d.files[i]}?dl=1" download>${esc(p)}</a>`).join('')}</div>`);
    $('#t').value = '';
  } catch (e) { say('失败：' + e.message, true); $('#prog').classList.remove('on'); }
  $('#go').disabled = false;
}

const mb = n => (n / 1048576).toFixed(n < 10485760 ? 2 : 1) + ' MB';
// job = null → 解析阶段（走马灯）；有 total → 真实百分比；无 total → 只显示已下载字节
function setProg(job) {
  const p = $('#prog'), bar = p.querySelector('.bar'), fill = p.querySelector('.fill');
  p.classList.add('on');
  const known = job && (job.known || job.total || job.files > 1 || job.pct >= 100);
  bar.classList.toggle('indet', !known);
  fill.style.width = known ? job.pct + '%' : '';
  $('#pct').textContent = !job ? '解析中' : known ? Math.floor(job.pct) + '%' : '下载中';
  $('#pfile').textContent = [job && job.files > 1 ? `第 ${job.file}/${job.files} 个` : '', job && job.note || ''].filter(Boolean).join(' · ');
  $('#pbytes').textContent = !job || !job.done ? '' :
    mb(job.done) + (job.total ? ' / ' + mb(job.total) : '') + (job.speed && job.pct < 100 ? ' · ' + mb(job.speed) + '/s' : '');
}
$('#go').onclick = go;
$('#t').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) go(); });
$('#paste').onclick = async () => {
  try { $('#t').value = await navigator.clipboard.readText(); go(); }
  catch { say(MOBILE ? '手机浏览器不让网页读剪贴板：长按上面的输入框 →「粘贴」，再点解析' : '浏览器不允许读剪贴板，请直接 Ctrl+V', true); $('#t').focus(); }
};
$('#open').onclick = () => fetch('/open');

// 手机访问（非本机）→ 手机模式：文件给手机保存，不显示电脑专用按钮
const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
let MOBILE = !['127.0.0.1', 'localhost'].includes(location.hostname);
document.body.classList.toggle('mobile', MOBILE);
if (MOBILE) $('#how').textContent = '在 App 里点“分享 → 复制链接”，长按下面的框粘贴，点解析；下载好后点“保存到手机”。';
let CLOUD = false;
fetch('/api/info').then(r => r.json()).then(i => {
  CLOUD = i.cloud;
  MOBILE = !i.local; document.body.classList.toggle('mobile', MOBILE);
  if (CLOUD) $('#how').textContent = '在 App 里点“分享 → 复制链接”，粘贴到下面，点解析；下载好后点“保存”。文件在服务器上只留 2 小时。';
  $('#lan').textContent = i.lan;
  if (!MOBILE && i.lan && !i.lan.includes('127.0.0.1')) $('#phone').classList.add('on');
  if (i.needKey && !i.authed) lock(true);
}).catch(() => {});

function lock(on) {
  $('#login').style.display = on ? '' : 'none';
  for (const e of [$('#t'), $('#go').parentElement, $('#how')]) e.style.display = on ? 'none' : '';
  if (on) $('#key').focus();
}
async function login() {
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
                                      body:JSON.stringify({key:$('#key').value})});
  if (r.ok) { lock(false); say(''); } else say('密码不对', true);
}
$('#loginBtn').onclick = login;
$('#key').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
